    .lin { animation-timing-function: linear; }
    .dot { fill: var(--green); }
    .glow { fill: var(--blue); }
    .bar { fill: var(--blue); transform-origin: left center; }
    /* redisq diagram classes, after the base rules */
    .panel { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .lane { fill: var(--yellow-tint); stroke: var(--yellow); stroke-width: 1.5; }
    .item { fill: var(--yellow); }
    .itxt { fill: #1f2328; font-size: 13px; font-weight: 700; }
    .track { fill: var(--border); }
    .wk { stroke: var(--blue); }
    .prod { stroke: var(--yellow); stroke-width: 2; }
    .swp { stroke: var(--purple); stroke-width: 2; }
    .sw-edge { fill: none; stroke: var(--purple); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .arrow-sw { fill: var(--purple); }
    .ring { fill: none; stroke: var(--purple); stroke-width: 2; transform-origin: center; }
    .note { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--purple); }
    .ok { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--green); }
