    @keyframes itemA { 0% { opacity: 0; transform: translate(90px, 160px); } 2.35% { opacity: 0; transform: translate(90px, 160px); } 2.94% { opacity: 1; transform: translate(102px, 160px); } 6.47% { opacity: 1; transform: translate(420px, 160px); } 8.24% { opacity: 1; transform: translate(420px, 160px); } 10.29% { opacity: 1; transform: translate(420px, 273px); } 12.35% { opacity: 1; transform: translate(212px, 273px); } 29.69% { opacity: 1; transform: translate(212px, 273px); } 31.46% { opacity: 0; transform: translate(212px, 273px); } 100% { opacity: 0; transform: translate(212px, 273px); } }
    @keyframes itemB { 0% { opacity: 0; transform: translate(90px, 160px); } 5.29% { opacity: 0; transform: translate(90px, 160px); } 5.88% { opacity: 1; transform: translate(102px, 160px); } 9.41% { opacity: 1; transform: translate(384px, 160px); } 10.29% { opacity: 1; transform: translate(384px, 160px); } 12.94% { opacity: 1; transform: translate(420px, 160px); } 31.46% { opacity: 1; transform: translate(420px, 160px); } 33.52% { opacity: 1; transform: translate(420px, 321px); } 35.58% { opacity: 1; transform: translate(212px, 321px); } 60.59% { opacity: 1; transform: translate(212px, 321px); } 64.71% { opacity: 1; transform: translate(420px, 160px); } 65.88% { opacity: 1; transform: translate(420px, 160px); } 67.94% { opacity: 1; transform: translate(420px, 273px); } 70% { opacity: 1; transform: translate(212px, 273px); } 87.34% { opacity: 1; transform: translate(212px, 273px); } 89.11% { opacity: 0; transform: translate(212px, 273px); } 100% { opacity: 0; transform: translate(212px, 273px); } }
    @keyframes ok0 { 0% { opacity: 0; } 29.69% { opacity: 0; } 30.4% { opacity: 1; } 37.93% { opacity: 1; } 39.4% { opacity: 0; } 87.34% { opacity: 0; } 88.04% { opacity: 1; } 95.57% { opacity: 1; } 97.04% { opacity: 0; } 100% { opacity: 0; } }
