    @keyframes front { 0% { opacity: 0; } 60.59% { opacity: 0; } 61.29% { opacity: 1; } 70% { opacity: 1; } 71.47% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes dot2 { 0% { opacity: 0; transform: translate(470px, 175px); } 65.88% { opacity: 0; transform: translate(470px, 175px); } 66.18% { opacity: 1; transform: translate(470px, 175px); } 69.96% { opacity: 1; transform: translate(740px, 175px); } 70.25% { opacity: 0; transform: translate(740px, 175px); } 100% { opacity: 0; transform: translate(740px, 175px); } }
