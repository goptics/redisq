<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
  <title id="title">redisq acknowledgments: a popped job stays pending in Redis until it is acknowledged or its visibility timeout runs out</title>
  <desc id="desc">One Queue object enqueues and consumes. At the start the queue and the pending set are empty and the consumer is idle. Job A and then job B are enqueued with RPUSH and wait in the list, A at the head. The consumer calls DequeueWithAckId: in one Redis script A leaves the head of the list, is stored in the pending hash with a visibility deadline (Redis time plus the visibility timeout), and is returned to the consumer. The consumer processes A and calls Acknowledge, which deletes A's pending entry and deadline. The consumer then pops B the same way, but returns without calling Acknowledge, so B stays pending. The queue object's sweep runs once a second. B's deadline passes; at the first sweep after it, B is pushed back to the front of the list. The consumer pops B again, under a new ack ID with a new deadline, processes it and acknowledges it. B was delivered twice, A once. At the end the list and the pending set are empty and the consumer is idle. Times are not to scale: the visibility timeout, 5 minutes by default, is drawn as 4 seconds.</desc>
  <style>
    :root {
      --dur: {D}s;
      --bg: #f6f8fa; --border: #d0d7de; --box: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #8c959f;
      --yellow: #f5c451; --yellow-tint: #fff1d6;
      --purple: #8250df; --green: #1a7f37; --blue: #0969da; --pink: #bf3989; --red: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b22; --border: #30363d; --box: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #6e7681;
        --yellow: #d29922; --yellow-tint: #2b2111;
        --purple: #a371f7; --green: #3fb950; --blue: #58a6ff; --pink: #db61a2; --red: #f85149;
      }
    }
    .bg { fill: var(--bg); stroke: var(--border); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .sig { fill: none; stroke: var(--pink); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .slot { fill: none; stroke: var(--yellow); stroke-width: 1; stroke-dasharray: 3 3; opacity: .5; }
    .arrow { fill: var(--line); }
    .arrow-sig { fill: var(--pink); }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
    .t { font-size: 14px; font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; text-anchor: start; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
    .why { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--red); }
    .lg { font-size: 12px; fill: var(--muted); text-anchor: start; }

    /* motion: one shared --dur loop; keyframes generated from a seconds timeline, keyframe name == element id */
    .a { animation: var(--dur) cubic-bezier(.65, 0, .35, 1) infinite; transform-box: fill-box; opacity: 0; }
    .lin { animation-timing-function: linear; }
    .dot { fill: var(--green); }
    .glow { fill: var(--blue); }
    .bar { fill: var(--blue); transform-origin: left center; }
    /* redisq diagram classes, after the base rules */
    .panel { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .lane { fill: var(--yellow-tint); stroke: var(--yellow); stroke-width: 1.5; }
    .item { fill: var(--yellow); }
    .itxt { fill: #1f2328; font-size: 13px; font-weight: 700; }
    .track { fill: var(--border); }
    .wk { stroke: var(--blue); }
    .prod { stroke: var(--yellow); stroke-width: 2; }
    .swp { stroke: var(--purple); stroke-width: 2; }
    .sw-edge { fill: none; stroke: var(--purple); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .arrow-sw { fill: var(--purple); }
    .ring { fill: none; stroke: var(--purple); stroke-width: 2; transform-origin: center; }
    .note { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--purple); }
    .ok { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--green); }
    /*KEYFRAMES*/
    @media (prefers-reduced-motion: reduce) { .a { animation-play-state: paused; animation-delay: -{STILL}s; } }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow" d="M0 0L8 4L0 8z"/>
    </marker>
    <marker id="arr-sw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow-sw" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="399" rx="12"/>

  <!-- legend -->
  <g transform="translate(24 30)">
    <rect class="item" x="0" y="-6" width="12" height="12" rx="3"/><text class="lg" x="20" y="0">job in Redis: waiting in the list, or pending</text>
    <circle class="dot" cx="6" cy="20" r="6"/><text class="lg" x="20" y="20">job handed to the consumer</text>
    <rect class="bar" x="300" y="-3" width="12" height="6" rx="2"/><text class="lg" x="320" y="0">visibility deadline: pending until it runs out</text>
    <circle class="ring" cx="306" cy="20" r="6"/><text class="lg" x="320" y="20">sweep, once a second</text>
  </g>
  <text class="m" x="936" y="30" style="text-anchor:end">times not to scale</text>
  <text class="m" x="936" y="48" style="text-anchor:end">visibility timeout (default 5 min) drawn as 4 s</text>

  <!-- producer -->
  <rect class="box prod" x="24" y="152" width="96" height="46" rx="8"/>
  <rect id="enq-glow" class="a item" x="24" y="152" width="96" height="46" rx="8"/>
  <text class="t" x="72" y="175">Enqueue</text>
  <path class="edge" d="M120 175H194" marker-end="url(#arr)"/>
  <text class="m" x="140" y="162">RPUSH</text>

  <!-- Redis -->
  <rect class="panel" x="160" y="96" width="540" height="282" rx="12"/>
  <text class="h" x="176" y="114">Redis</text>

  <text class="h" x="196" y="140">queue</text>
  <text class="m" x="244" y="140" style="text-anchor:start">&lt;key&gt; · list</text>
  <rect class="lane" x="196" y="152" width="274" height="46" rx="8"/>
  <rect class="slot" x="348" y="160" width="30" height="30" rx="5"/>
  <rect class="slot" x="384" y="160" width="30" height="30" rx="5"/>
  <rect class="slot" x="420" y="160" width="30" height="30" rx="5"/>
  <text class="m" x="363" y="210">tail</text>
  <text class="m" x="435" y="210">head</text>
  <text id="front" class="a note" x="398" y="226">sweep: LPUSH, back to the front</text>

  <text class="h" x="196" y="250">pending</text>
  <text class="m" x="256" y="250" style="text-anchor:start">&lt;key&gt;:nacked + :timeouts</text>
  <rect class="box" x="196" y="262" width="274" height="100" rx="8"/>
  <rect class="track" x="254" y="285" width="196" height="6" rx="3"/>
  <rect id="bar0" class="a lin bar" x="254" y="285" width="196" height="6" rx="3"/>
  <rect class="track" x="254" y="333" width="196" height="6" rx="3"/>
  <rect id="bar1" class="a lin bar" x="254" y="333" width="196" height="6" rx="3"/>
  <text id="ok0" class="a ok" x="352" y="302">✓ Acknowledge: deleted</text>
  <text id="late1" class="a why" x="352" y="350">deadline passed</text>

  <!-- pop: LPOP + pending + deadline, one script -->
  <path class="edge" d="M470 175H738" marker-end="url(#arr)"/>
  <text class="m" x="604" y="162">pop: one script</text>
  <text class="m" x="604" y="188">LPOP → pending → reply</text>

  <!-- consumer -->
  <rect class="box wk" x="740" y="146" width="196" height="64" rx="8"/>
  <rect id="c-glow" class="a glow" x="740" y="146" width="196" height="64" rx="8"/>
  <text class="t" x="838" y="166">Consumer</text>
  <text class="m" x="838" y="184">DequeueWithAckId</text>
  <rect class="track" x="788" y="197" width="100" height="4" rx="2"/>
  <rect id="c-bar" class="a lin bar" x="788" y="197" width="100" height="4" rx="2"/>
  <text id="noack" class="a why" x="884" y="226">no Acknowledge</text>

  <!-- Acknowledge: consumer → pending -->
  <path class="edge" d="M780 210V240H450V260" marker-end="url(#arr)"/>
  <text class="m" x="616" y="228">Acknowledge(ackID)</text>

  <!-- sweep: client side, runs a script on Redis -->
  <rect class="box swp" x="740" y="300" width="196" height="50" rx="8"/>
  <rect id="ring" class="a ring" x="740" y="300" width="196" height="50" rx="8"/>
  <text class="t" x="838" y="318">Sweep</text>
  <text class="m" x="838" y="336">every 1 s, per Queue object</text>
  <path class="sw-edge" d="M740 325H472" marker-end="url(#arr-sw)"/>
  <text class="m" x="604" y="313" style="fill: var(--purple)">requeue expired</text>

  <!-- moving parts -->
  <g id="itemA" class="a"><rect class="item" x="0" y="0" width="30" height="30" rx="5"/><text class="itxt" x="15" y="15">A</text></g>
  <g id="itemB" class="a"><rect class="item" x="0" y="0" width="30" height="30" rx="5"/><text class="itxt" x="15" y="15">B</text></g>
  <circle id="dot0" class="a lin dot" cx="0" cy="0" r="7"/>
  <circle id="dot1" class="a lin dot" cx="0" cy="0" r="7"/>
  <circle id="dot2" class="a lin dot" cx="0" cy="0" r="7"/>
  <circle id="ackd0" class="a lin dot" cx="0" cy="0" r="5"/>
  <circle id="ackd2" class="a lin dot" cx="0" cy="0" r="5"/>
</svg>
